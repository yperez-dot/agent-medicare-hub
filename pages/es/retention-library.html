<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biblioteca de Retención | Medicare Agent Hub</title>

<style>
:root{
 --primary:#452068;
 --primary-dark:#2f1348;
 --accent:#ff1090;

 --bg:#f7f5fb;
 --card:#ffffff;
 --text:#1f1b2a;
 --muted:#6e687c;
 --border:#ece8f3;

 --radius:18px;
 --shadow:0 14px 30px rgba(20,10,40,.12);
 --shadow-soft:0 8px 18px rgba(20,10,40,.08);
 --shadow-hover:0 12px 26px rgba(20,10,40,.12);
 --tint: rgba(69,32,104,.03);
 --divider: rgba(69,32,104,.10);
 --ring: 0 0 0 3px rgba(255,16,144,.14);

 --maxw:1100px;
}
.top-bar{background:#fff;border-bottom:1px solid #E7E4ED;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 32px;gap:16px;}
.logo-wrap img{height:52px;width:auto;display:block;}
.pill-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.pill-nav a{display:inline-block;padding:9px 20px;border:1.5px solid #E7E4ED;border-radius:999px;font:600 13px/1 Arial,sans-serif;color:#452068;text-decoration:none;transition:all .15s;}
.pill-nav a:hover,.pill-nav a.active{background:#452068;border-color:#452068;color:#fff;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub-nav.css">
<link rel="stylesheet" href="/hub-density.css">
<link rel="stylesheet" href="/hub-clean.css">
<style id="r3">
body{background:#F6F5F8;}
.wrap{max-width:1100px;margin:0 auto;padding:18px 22px 40px;}
.lib-list{background:#fff;border:1px solid #ECE8F1;border-radius:14px;padding:6px 18px;}
.lib-list h2{font:700 16px/1.3 'Inter',Arial,sans-serif;color:#241a30;margin:10px 0 4px;}
.lib-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;}
.lib-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #F1EDF5;text-decoration:none;color:#241a30;font:600 14.5px/1.35 'Inter',Arial,sans-serif;}
.lib-row:hover{color:#452068;}
.lib-row span{font:600 12.5px/1 Arial,sans-serif;color:#452068;white-space:nowrap;}
@media(max-width:700px){.lib-rows{grid-template-columns:1fr;}}
</style>
<script src="/hub-nav.js" defer></script>
</head>
<body>
<div class="top-bar">
  <div class="logo-wrap"><img src="/files/thei-logo.png" alt="THEI"></div>
  <nav class="pill-nav">
    <a href='/home'>Panel del Agente</a>
    <a href='/learn'>Universidad del Broker</a>
    <a href='/carrier-info'>Info de Aseguradoras</a>
    <a href='/events'>Eventos</a>
    <a href='/compliance'>Cumplimiento</a>
    <a href='/tools-perks'>Hub de Herramientas</a>
    <a href='/retention-toolkit'>Kit de Retención</a>
    <a href='/sep-tracker'>Rastreador de SEP</a>
    <a href="#" onclick="logout()" style="color:#D6336C;border-color:#F5C0C0;">Cerrar Sesión</a>
    <button onclick="window.location.href='/home.html'" title="Tour del Hub" style="width:30px;height:30px;border-radius:50%;background:#452068;color:#fff;border:none;font:700 13px/1 Arial,sans-serif;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:4px;">?</button>
  </nav>
</div>
<!-- PÁGINA COMPLETA — enlaces extraídos a continuación -->
<script>
(function(){
  var p = window.location.pathname.replace(/\/+$/,'') || '/';
  document.querySelectorAll('.pill-nav a[href]').forEach(function(a){
    a.classList.remove('active');
    var h = a.getAttribute('href').replace(/\/+$/,'');
    if (h && p === h) a.classList.add('active');
  });
})();
</script>
</body>
</html>
