<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Live Medicare disaster Special Enrollment Periods by state — search active SEPs from The Health Experts Insurance."/>
<title>SEP Tracker | The Health Experts Insurance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}body{font-family:'Inter',Arial,sans-serif;background:#F6F5F8;display:flex;flex-direction:column;height:100dvh;max-height:100dvh;overflow:hidden;}
.top-bar{background:#fff;border-bottom:1px solid #E7E4ED;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 32px;gap:16px;}
.logo-wrap img{height:52px;width:auto;display:block;}
.pill-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.pill-nav a{display:inline-block;padding:9px 20px;border:1.5px solid #E7E4ED;border-radius:999px;font:600 13px/1 Arial,sans-serif;color:#452068;text-decoration:none;transition:all .15s;}
.pill-nav a:hover,.pill-nav a.active{background:#452068;border-color:#452068;color:#fff;}
.pill-nav a.nav-call{background:#452068;border-color:#452068;color:#fff;}
.pill-nav a.nav-call:hover{background:#341850;border-color:#341850;}
.pill-nav a.nav-signout{color:#D6336C;border-color:#F5C0C0;}
.pill-nav a.nav-tour{width:30px;height:30px;border-radius:50%;background:#452068;color:#fff;font:700 13px/1 Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:4px;flex-shrink:0;padding:0;border:none;}
iframe{flex:1 1 auto;min-height:0;border:none;width:100%;display:block;background:#F6F5F8;}
/* public lead-magnet nav type */
.pill-nav a{font-size:14px;padding:10px 18px;}
.pill-nav a.nav-call{font-size:15px;padding:11px 20px;}
@media (max-width:700px){
  .top-bar{padding:10px 14px; position:relative !important; /* override hub-nav sticky — prevents clipping iframe hero */}
  .logo-wrap img{height:40px;}
  .pill-nav a{font-size:15px;padding:11px 16px;}
  .pill-nav a.nav-call{font-size:16px;padding:12px 18px;}
}
/* Keep shell chrome non-sticky on all widths for this public page */
.top-bar{position:relative !important; flex-shrink:0; z-index:2;}


</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub-nav.css">
<script src="/hub-nav.js" defer></script>

<style id="sep-shell-overrides">
/* Public SEP page: never let hub-nav sticky/fixed chrome cover the iframe hero */
html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden !important;
  overscroll-behavior: none;
}
body {
  display: flex !important;
  flex-direction: column !important;
  max-height: 100dvh;
}
.top-bar,
.hub-nav-ready .top-bar,
html.hub-nav-ready .top-bar,
body.hub-nav-ready .top-bar {
  position: relative !important;
  top: auto !important;
  flex-shrink: 0 !important;
  z-index: 2 !important;
}
iframe {
  flex: 1 1 auto !important;
  min-height: 0 !important;
  width: 100% !important;
  border: 0 !important;
  display: block !important;
  background: #F6F5F8;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo-wrap"><img src="/thei-logo.png" alt="THEI"></div>
  <nav class="pill-nav" id="sepShellNav" aria-label="SEP Tracker navigation"></nav>
</div>

<iframe
  src="/sep-tracker-app.html?v=20260823-hero3"
  onload="try{this.contentWindow.scrollTo(0,0)}catch(e){}"
  title="SEP Disaster Tracker"
  allow="fullscreen"
></iframe>

<script>
(function(){
  function loggedIn(){
    try {
      var s = JSON.parse(localStorage.getItem('hub_session') || 'null');
      return !!(s && s.token && s.expires > Date.now());
    } catch(e) { return false; }
  }

  var nav = document.getElementById('sepShellNav');
  if (loggedIn()) {
    nav.innerHTML =
      "<a href='/home'>Agent Dashboard</a>"+
      "<a href='/learn'>Broker University</a>"+
      "<a href='/carrier-info'>Carrier Info</a>"+
      "<a href='/events'>Events</a>"+
      "<a href='/compliance'>Compliance</a>"+
      "<a href='/tools-perks'>Agent Tools Hub</a>"+
      "<a href='/retention-toolkit'>Retention Toolkit</a>"+
      "<a class='active' href='/sep-tracker'>SEP Tracker</a>"+
      "<a href='#' class='nav-signout' id='sepSignOut'>Sign Out</a>"+
      "<a class='nav-tour' href='/home#tour' title='Hub tour'>?</a>";
    var out = document.getElementById('sepSignOut');
    if (out) out.addEventListener('click', function(e){
      e.preventDefault();
      localStorage.removeItem('hub_session');
      window.location.replace('/login.html');
    });
  } else {
    nav.innerHTML =
      "<a class='active' href='/sep-tracker'>SEP Tracker</a>"+
      "<a class='nav-call' href='tel:18003806821'>Call 1-800-380-6821</a>"+
      "<a href='/login.html'>Agent Login</a>";
  }
})();
</script>
</body>
</html>
