(function(){
  if (new URLSearchParams(window.location.search).get('preview') === 'THEI') return;
  try {
    var s = JSON.parse(localStorage.getItem('hub_session') || 'null');
    if (!s || !s.token || s.expires < Date.now()) {
      localStorage.removeItem('hub_session');
      window.location.replace('/login.html');
    }
  } catch(e) { window.location.replace('/login.html'); }
})();
function logout(){localStorage.removeItem('hub_session');window.location.replace('/login.html');}
</script>

<script>
const EMOJI_BY_TYPE = { urgent: '🚨', watch: '⚠️', update: '📋', event: '📅' };

function text(value, fallback) {
  return (value == null || value === '') ? (fallback || '') : value;
}

// --- Feed text cleanup ---------------------------------------------------
// Raw alert text comes straight from ingested emails: broken encoding
// (Â´, ï»¿, stray â), long tracking URLs, mid-word truncation, and
// occasionally raw HTML/script the sender included. These helpers clean
// that up before it's ever put on the page.

const CP1252_EXTRA = {0x80:0x20AC,0x82:0x201A,0x83:0x0192,0x84:0x201E,0x85:0x2026,0x86:0x2020,0x87:0x2021,0x88:0x02C6,0x89:0x2030,0x8A:0x0160,0x8B:0x2039,0x8C:0x0152,0x8E:0x017D,0x91:0x2018,0x92:0x2019,0x93:0x201C,0x94:0x201D,0x95:0x2022,0x96:0x2013,0x97:0x2014,0x98:0x02DC,0x99:0x2122,0x9A:0x0161,0x9B:0x203A,0x9C:0x0153,0x9E:0x017E,0x9F:0x0178};
const CP1252_REVERSE = {};
Object.entries(CP1252_EXTRA).forEach(([b, u]) => { CP1252_REVERSE[u] = Number(b); });

// Reverses "UTF-8 bytes mis-read as Windows-1252" mojibake (Ã©, â€™, etc.)
function fixMojibake(str) {
  if (!/[-ÿ‘-„]/.test(str)) return str;
  try {
    const bytes = [];
    for (const ch of str) {
      const code = ch.codePointAt(0);
      if (code < 0x80 || code <= 0xFF) bytes.push(code);
      else if (CP1252_REVERSE[code] !== undefined) bytes.push(CP1252_REVERSE[code]);
      else return str;
    }
    return new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(bytes));
  } catch (e) {
    return str;
  }
}

function decodeEntities(str) {
  const ta = document.createElement('textarea');
  ta.innerHTML = str;
  return ta.value;
}

function stripUrls(str) {
  return str.replace(/https?:\/\/\S+/g, '').replace(/\s{2,}/g, ' ').trim();
}

function truncateClean(str, max) {
  if (str.length <= max) return str;
  const cut = str.slice(0, max);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > max * 0.6 ? cut.slice(0, lastSpace) : cut).trim() + '…';
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function cleanFeedText(raw, maxLen) {
  let s = decodeEntities(text(raw));
  s = s.replace(/<[^>]*>/g, ' ');           // drop any embedded HTML/script tags
  s = fixMojibake(s);
  s = s.replace(/﻿|ï»¿/g, '');          // stray BOM
  s = s.replace(/[\u0000-\u001F\u007F-\u009F\u00AD\u034F\u200B-\u200F\u2028-\u202E\u2060-\u2064\u206A-\u206F\uFEFF]/g, '');  // invisible/control chars (hidden preheader padding)
  s = s.replace(/(\S{1,3})(?:\s+\1){3,}/g, ' ');  // repeated-token filler (hidden preheader junk)
  const withoutUrls = stripUrls(s);
  s = withoutUrls.length > 20 ? withoutUrls : s.replace(/https?:\/\/\S+/g, '[link]');
  s = s.replace(/Â(?![ -ÿ])/g, '')          // orphaned Â artifact
       .replace(/â(?![-ÿ])/g, '–');    // orphaned â -> en dash
  s = s.replace(/\s{2,}/g, ' ').trim();
  if (maxLen) s = truncateClean(s, maxLen);
  return escapeHtml(s);
}
// ---------------------------------------------------------------------------

function normalizeAlert(a) {
  const type = a.type || (a.urgent ? 'urgent' : 'update');
  let body = cleanFeedText(text(a.body, a.summary), 240);
  if (body.replace(/[^a-zA-Z0-9]/g, '').length < 5) body = ''; // nothing left after cleanup
  return {
    type,
    emoji: a.emoji || EMOJI_BY_TYPE[type] || '📌',
    date: cleanFeedText(a.date),
    title: cleanFeedText(text(a.title), 160),
    body,
    source: a.source || ''
  };
}

const PULSE_PRIVATE = /wallet balance|personal access token|cherry contract|cherry collections|yperez-dot|igor-config|payment update needed|contract termination|sattori group|joseph gonzalez/i;
function isPublicAlert(a) {
  const hay = [a.id, a.title, a.body, a.summary].filter(Boolean).join(' ');
  return !PULSE_PRIVATE.test(hay);
}

async function loadFeed() {
  try {
    const res = await fetch('/files/pulse-feed.json?v=' + Date.now());
    const data = await res.json();

    // Updated badge
    const badge = document.getElementById('updated-badge');
    if (badge && data.updated) badge.textContent = 'Last updated: ' + data.updated;

    // Alerts
    const container = document.getElementById('alerts-container');
    const publicAlerts = (data.alerts || []).filter(isPublicAlert);
    if (publicAlerts.length) {
      container.innerHTML = publicAlerts.map(normalizeAlert).map(a => `
        <div class="alert-card ${a.type}">
          <div class="alert-emoji">${a.emoji}</div>
          <div class="alert-body">
            <div class="alert-date">${a.date}</div>
            <div class="alert-title">${a.title}</div>
            ${a.body ? `<div class="alert-text">${a.body}</div>` : ''}
            ${a.source ? `<a class="alert-link" href="${escapeHtml(a.source)}" ${a.source.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>Read more →</a>` : ''}
          </div>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<div class="loading">No current alerts.</div>';
    }

    // Archive
    const archive = document.getElementById('archive-container');
    if (data.weekly_pulses && data.weekly_pulses.length) {
      archive.innerHTML = data.weekly_pulses.map(p => `
        <div class="pulse-archive-item">
          <div>
            <div class="pulse-week">${text(p.week)}</div>
            <div class="pulse-headline">${text(p.headline)}</div>
          </div>
          ${p.link ? `<a href="${p.link}" style="font:700 12px/1 Arial,sans-serif;color:#452068;text-decoration:none;white-space:nowrap;margin-left:16px;">View →</a>` : '<span style="font:400 12px/1 Arial,sans-serif;color:#C8C4D0;">Email only</span>'}
        </div>
      `).join('');
    } else {
      archive.innerHTML = '<div class="loading">No archived pulses yet.</div>';
    }
  } catch(e) {
    document.getElementById('alerts-container').innerHTML = '<div class="loading">Could not load updates.</div>';
  }
}
loadFeed();
</script>
