<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pulse Library | THEI Agent Hub</title>
<script>
(function(){
  if (new URLSearchParams(window.location.search).get('preview') === 'THEI') return;
  try {
    var s = JSON.parse(localStorage.getItem('hub_session') || 'null');
    if (!s || !s.token || s.expires < Date.now()) {
      localStorage.removeItem('hub_session');
      window.location.replace('/login.html');
    }
  } catch(e) { window.location.replace('/login.html'); }
})();
function logout(){localStorage.removeItem('hub_session');window.location.replace('/login.html');}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',Arial,sans-serif;background:#F6F5F8;color:#241C2E;font-size:15px;line-height:1.55;}
.top-bar{background:#fff;border-bottom:1px solid #E7E4ED;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 32px;gap:16px;}
.logo-wrap img{height:52px;width:auto;display:block;}
.pill-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.pill-nav a{display:inline-block;padding:9px 20px;border:1.5px solid #E7E4ED;border-radius:999px;font:600 13px/1 Arial,sans-serif;color:#452068;text-decoration:none;transition:all .15s;}
.pill-nav a:hover,.pill-nav a.active{background:#452068;border-color:#452068;color:#fff;}
.hero{background:linear-gradient(135deg,#452068,#341751);padding:36px 32px;text-align:center;}
.hero .badge{display:inline-block;padding:5px 14px;border-radius:999px;background:#FF1090;color:#fff;font:700 11px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.hero h1{font-size:28px;font-weight:700;color:#fff;margin-bottom:6px;}
.hero p{font-size:14px;color:rgba(255,255,255,.8);}
.wrap{max-width:860px;margin:0 auto;padding:36px 24px 64px;}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.pulse-entry{background:#fff;border:1px solid #E7E4ED;border-radius:14px;padding:24px;text-decoration:none;color:#241C2E;transition:all .2s;cursor:pointer;}
.pulse-entry:hover{box-shadow:0 6px 16px rgba(69,32,104,.1);transform:translateY(-2px);border-color:#452068;}
.pulse-entry .pulse-week{font:700 11px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:#9A94A8;margin-bottom:8px;}
.pulse-entry .pulse-date{font:600 13px/1 Arial,sans-serif;color:#452068;margin-bottom:10px;}
.pulse-entry .pulse-headline{font:600 15px/1.4 Arial,sans-serif;color:#241C2E;margin-bottom:12px;}
.pulse-entry .pulse-topics{display:flex;flex-wrap:wrap;gap:6px;font:400 12px/1 Arial,sans-serif;color:#9A94A8;}
.pulse-entry .pulse-topic-tag{background:#F1ECF6;color:#452068;padding:4px 10px;border-radius:999px;}
.empty-state{text-align:center;padding:48px 24px;color:#9A94A8;font-size:14px;grid-column:1/-1;}
.back-link{display:inline-block;margin-bottom:20px;font:600 12px/1 Arial,sans-serif;color:#452068;text-decoration:none;}
.back-link:hover{text-decoration:underline;}
@media(max-width:600px){.pill-nav a{font-size:11px;padding:7px 12px;}.wrap{padding:20px 16px 48px;}.library-grid{grid-template-columns:1fr;}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub-nav.css">
<script src="/hub-nav.js" defer></script>
</head>
<body>

<div class="top-bar">
  <div class="logo-wrap"><img src="/thei-logo.png" alt="THEI"></div>
  <nav class="pill-nav">
    <a href='/home'>Agent Dashboard</a>
    <a href='/learn'>Broker University</a>
    <a href='/carrier-info'>Carrier Info</a>
    <a href='/events'>Events</a>
    <a href='/compliance'>Compliance</a>
    <a href='/tools-perks'>Agent Tools Hub</a>
    <a href='/retention-toolkit'>Retention Toolkit</a>
    <a href='/sep-tracker'>SEP Tracker</a>
    <a href="#" onclick="logout()" style="color:#D6336C;border-color:#F5C0C0;">Sign Out</a>
    <a href='/home#tour' style='width:30px;height:30px;border-radius:50%;background:#452068;color:#fff;font:700 13px/1 Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:4px;flex-shrink:0;' title='Hub tour'>?</a>
  </nav>
</div>

<div class="hero">
  <div class="badge">Archive</div>
  <h1>Pulse Library</h1>
  <p>Weekly Agent Pulse digests — every edition, in one place.</p>
</div>

<div class="wrap">
  <a class="back-link" href="/agent-pulse">← Live updates</a>
  <div class="library-grid" id="library-container">
    <div class="empty-state">Loading archived pulses...</div>
  </div>
</div>

<script>
function text(value) {
  return (value == null || value === '') ? '' : value;
}

async function loadLibrary() {
  const container = document.getElementById('library-container');
  try {
    const res = await fetch('/files/pulse-feed.json?v=' + Date.now());
    if (!res.ok) throw new Error('Failed to load feed');
    const feed = await res.json();

    if (feed.weekly_pulses && feed.weekly_pulses.length) {
      container.innerHTML = feed.weekly_pulses.map(p => `
        <a class="pulse-entry" href="${p.link || '#'}">
          <div class="pulse-week">${text(p.week)}</div>
          <div class="pulse-date">${text(p.date)}</div>
          <div class="pulse-headline">${text(p.headline)}</div>
          <div class="pulse-topics">
            ${p.tag ? `<span class="pulse-topic-tag">${p.tag}</span>` : ''}
          </div>
        </a>
      `).join('');
    } else {
      container.innerHTML = '<div class="empty-state">No archived pulses yet. Check back soon!</div>';
    }
  } catch(e) {
    container.innerHTML = '<div class="empty-state">Could not load library.</div>';
  }
}
loadLibrary();
</script>
<script>
(function(){
  var p = window.location.pathname.replace(/\/+$/,'') || '/';
  document.querySelectorAll('.pill-nav a[href]').forEach(function(a){
    a.classList.remove('active');
    var h = a.getAttribute('href').replace(/\/+$/,'');
    if (h && p === h) a.classList.add('active');
  });
})();
</script>
</body>
</html>
