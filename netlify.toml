# Agent Hub — Netlify config
# publish = "." keeps /files/* accessible from repo root
# Rewrite rule sends /:slug → /pages/:slug (fires only if no real file exists at path)

[build]
  publish = "."

# Rewrite: /:slug → /pages/:slug (200 = transparent rewrite, URL stays clean)
[[redirects]]
  from = "/:slug"
  to = "/pages/:slug"
  status = 200
  force = false

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
