<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEP Disaster Tracker · THEI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f4f9;color:#1a1325;min-height:100vh;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:#fff;border-bottom:1px solid #eae5f0;}
.hdr img{height:40px;width:auto;}
.hero{background:linear-gradient(135deg,#452068,#2f1650);padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.hero-title{color:#fff;font-size:20px;font-weight:700;}
.hero-sub{color:#d9c9ef;font-size:13px;margin-top:3px;}
.hero-badge{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 16px;text-align:right;}
.hero-badge-label{color:#d9c9ef;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
.hero-badge-val{color:#fff;font-size:13px;font-weight:700;margin-top:2px;}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.tile{background:#fff;border:1px solid #eae5f0;border-radius:10px;padding:14px 18px;border-left:4px solid var(--tc,#452068);}
.tile-n{font-size:26px;font-weight:700;color:#1a1325;}
.tile-l{font-size:12px;color:#6b6477;margin-top:2px;}
.filter-section{margin-bottom:16px;}
.filter-label{font-size:11px;font-weight:700;color:#9990a5;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.pills::-webkit-scrollbar{height:4px;}
.pills::-webkit-scrollbar-thumb{background:#d0c8df;border-radius:2px;}
.pill{flex-shrink:0;cursor:pointer;padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:none;background:#f1ecf7;color:#452068;transition:background .15s,color .15s;}
.pill.on{background:#452068;color:#fff;}
.pill .badge{font-size:11px;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.25);}
.pill:not(.on) .badge{background:#fff;color:#452068;}
.spill{flex-shrink:0;cursor:pointer;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;border:none;transition:background .15s,color .15s;}
.spill.s-all{background:#f1ecf7;color:#452068;} .spill.s-all.on{background:#452068;color:#fff;}
.spill.s-active{background:#e8f7ed;color:#1e7a38;} .spill.s-active.on{background:#1e7a38;color:#fff;}
.spill.s-expiring{background:#fdf3df;color:#8a6a0f;} .spill.s-expiring.on{background:#8a6a0f;color:#fff;}
.spill.s-ended{background:#f1eff2;color:#6b6477;} .spill.s-ended.on{background:#6b6477;color:#fff;}
.search-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
.search-row input{flex:1;padding:10px 14px;border:1px solid #ddd6e6;border-radius:8px;font-size:13.5px;font-family:inherit;color:#1a1325;outline:none;}
.search-row input:focus{border-color:#452068;}
.clear-btn{font-size:13px;font-weight:600;color:#ff1090;cursor:pointer;white-space:nowrap;background:none;border:none;}
.count-line{font-size:13px;color:#6b6477;margin-bottom:16px;}
.count-line b{color:#1a1325;}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.card-grid{grid-template-columns:repeat(2,1fr);} .tiles{grid-template-columns:repeat(2,1fr);}}
@media(max-width:580px){.card-grid{grid-template-columns:1fr;} .tiles{grid-template-columns:repeat(2,1fr);}}
.card{background:#fff;border:1px solid #eae5f0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.card-bar{height:4px;}
.card-body{padding:18px 20px;display:flex;flex-direction:column;flex:1;}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.state-badge{background:#f1ecf7;color:#452068;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
.card-name{font-size:15px;font-weight:700;line-height:1.35;color:#1a1325;}
.card-type{font-size:12px;color:#6b6477;margin-top:4px;}
.divider{height:1px;background:#eee8f3;margin:12px 0;}
.sep-label{font-size:11px;font-weight:700;color:#9990a5;text-transform:uppercase;letter-spacing:.05em;}
.sep-val{font-size:13.5px;font-weight:700;color:#452068;margin-top:3px;}
.county-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#6b6477;background:#f6f4f9;padding:5px 10px;border-radius:20px;cursor:pointer;border:none;margin-top:12px;}
.county-list{font-size:12px;color:#6b6477;line-height:1.6;margin-top:8px;background:#faf9fb;border-radius:8px;padding:10px 12px;}
.spacer{flex:1;}
.details-btn{display:block;text-align:center;font-size:13px;font-weight:700;color:#452068;border:1.5px solid #452068;border-radius:8px;padding:9px;cursor:pointer;background:none;margin-top:14px;width:100%;transition:background .15s,color .15s;}
.details-btn:hover{background:#452068;color:#fff;}
.empty{text-align:center;padding:60px 20px;color:#9990a5;font-size:14px;}
.overlay{position:fixed;inset:0;background:rgba(26,19,37,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;}
.modal{background:#fff;border-radius:14px;max-width:580px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;}
.modal-close{font-size:22px;color:#9990a5;cursor:pointer;background:none;border:none;line-height:1;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.mf-label{font-size:11px;font-weight:700;color:#9990a5;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.mf-val{font-size:13.5px;font-weight:600;color:#1a1325;}
.mf-val.purple{color:#452068;font-weight:700;}
.main{max-width:1300px;margin:0 auto;padding:24px 32px 60px;}
</style>
</head>

      <div><div class="mf-label">Declaration #s</div><div class="mf-val" id="m-decls"></div></div>
    </div>
    <div><div class="mf-label">Counties covered</div><div style="font-size:13px;color:#1a1325;margin-top:6px;line-height:1.7;" id="m-counties"></div></div>
  </div>
</div>

var ALL_STATES=["FL", "AK", "AL", "AR", "AS", "CA", "CO", "CT", "DC", "DE", "GA", "GU", "HI", "IA", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "PR", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"];
var STATUS={active:{label:'Active',color:'#2fa84f'},expiring:{label:'Expiring soon',color:'#e0a324'},ended:{label:'Ended',color:'#9990a5'}};
var st={activeTab:'FL',statusTab:'all',search:'',expanded:{}};
function isoToday(){
  var n=new Date();
  return [n.getFullYear(), String(n.getMonth()+1).padStart(2,'0'), String(n.getDate()).padStart(2,'0')].join('-');
}
function applyLiveStatus(){
  var today=isoToday();
  DATA.forEach(function(d){
    if(!d.sepEnd) return;
    var days=Math.round((Date.parse(d.sepEnd+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/86400000);
    if(days<0) d.status='ended';
    else if(days<=30) d.status='expiring';
    else d.status='active';
  });
}
function cText(d){return d.counties==='ALL'?'All counties statewide':d.counties.join(', ');}
function cChip(d){if(d.counties==='ALL')return 'All counties';var n=d.counties.length;return n+(n===1?' county':' counties');}
function getFiltered(){
  var q=st.search.trim().toLowerCase();
  return DATA.filter(function(d){
    if(st.activeTab!=='all'&&d.state!==st.activeTab)return false;
    if(st.statusTab==='active')return d.status!=='ended';
    if(st.statusTab==='expiring')return d.status==='expiring';
    if(st.statusTab==='ended')return d.status==='ended';
    return true;
  }).filter(function(d){
    if(!q)return true;
    return d.name.toLowerCase().indexOf(q)>=0||d.state.toLowerCase().indexOf(q)>=0||
      d.type.toLowerCase().indexOf(q)>=0||
      (d.counties!=='ALL'&&d.counties.some(function(c){return c.toLowerCase().indexOf(q)>=0;}));
  });
}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  var f=getFiltered();
  var activeN=DATA.filter(function(d){return d.status!=='ended';}).length;
  var expiringN=DATA.filter(function(d){return d.status==='expiring';}).length;
  var endedN=DATA.filter(function(d){return d.status==='ended';}).length;
  var flN=DATA.filter(function(d){return d.state==='FL'&&d.status!=='ended';}).length;
  var tiles=[
    {label:'Active SEPs',count:activeN,color:'#2fa84f'},
    {label:'Expiring Soon',count:expiringN,color:'#e0a324'},
    {label:'Florida Active',count:flN,color:'#452068'},
    {label:'Total SEPs',count:DATA.length,color:'#6b6477'}
  ];
  document.getElementById('tiles').innerHTML=tiles.map(function(t){return '<div class="tile" style="--tc:'+t.color+'"><div class="tile-n">'+t.count+'</div><div class="tile-l">'+t.label+'</div></div>';}).join('');
  var sc={};ALL_STATES.forEach(function(s){sc[s]=DATA.filter(function(d){return d.state===s;}).length;});
  var stitems=[{key:'all',label:'All States',count:DATA.length}].concat(ALL_STATES.map(function(s){return {key:s,label:s,count:sc[s]};}));
  document.getElementById('state-pills').innerHTML=stitems.map(function(t){return '<button class="pill'+(st.activeTab===t.key?' on':'')+'" onclick="setTab(\'activeTab\',\''+t.key+'\')">'+t.label+' <span class="badge">'+t.count+'</span></button>';}).join('');
  var spItems=[{key:'all',cls:'s-all',label:'All',count:DATA.length},{key:'active',cls:'s-active',label:'Active',count:activeN},{key:'expiring',cls:'s-expiring',label:'Expiring Soon',count:expiringN},{key:'ended',cls:'s-ended',label:'Ended',count:endedN}];
  document.getElementById('status-pills').innerHTML=spItems.map(function(t){return '<button class="spill '+t.cls+(st.statusTab===t.key?' on':'')+'" onclick="setTab(\'statusTab\',\''+t.key+'\')">'+t.label+' &middot; '+t.count+'</button>';}).join('');
  var hasF=st.search.trim()||st.activeTab!=='FL'||st.statusTab!=='all';
  document.getElementById('clear-btn').style.display=hasF?'inline':'none';
  document.getElementById('count-line').innerHTML='Showing <b>'+f.length+'</b> of <b>'+DATA.length+'</b> SEPs';
  document.getElementById('empty').style.display=f.length===0?'block':'none';
  document.getElementById('card-grid').style.display=f.length===0?'none':'grid';
  document.getElementById('card-grid').innerHTML=f.map(function(d){
    var meta=STATUS[d.status]||STATUS.ended;
    var open=!!st.expanded[d.id];
    return '<div class="card"><div class="card-bar" style="background:'+meta.color+'"></div><div class="card-body"><div class="card-top"><span class="state-badge">'+e(d.state)+'</span><span style="font-size:12px;font-weight:600;color:'+meta.color+';display:flex;align-items:center;"><span class="status-dot" style="background:'+meta.color+'"></span>'+meta.label+'</span></div><div class="card-name">'+e(d.name)+'</div><div class="card-type">'+e(d.type)+'</div><div class="divider"></div><div class="sep-label">SEP window</div><div class="sep-val">'+e(d.sepWindow)+'</div><button class="county-chip" onclick="toggleC(\''+d.id+'\')">'+cChip(d)+' '+(open?'&#9652;':'&#9662;')+'</button>'+(open?'<div class="county-list">'+e(cText(d))+'</div>':'')+'<div class="spacer"></div><button class="details-btn" onclick="openModal(\''+d.id+'\')">View full details</button></div></div>';
  }).join('');
}
function setTab(k,v){st[k]=v;render();}
function toggleC(id){st.expanded[id]=!st.expanded[id];render();}
function openModal(id){
  var d=DATA.find(function(x){return x.id===id;});
  if(!d)return;
  var meta=STATUS[d.status]||STATUS.ended;
  document.getElementById('m-state').textContent=d.state;
  document.getElementById('m-name').textContent=d.name;
  document.getElementById('m-type').textContent=d.type;
  document.getElementById('m-incident').textContent=d.incidentWindow;
  document.getElementById('m-sep').textContent=d.sepWindow;
  document.getElementById('m-status').innerHTML='<span style="color:'+meta.color+';display:flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:'+meta.color+';display:inline-block;"></span>'+meta.label+'</span>';
  document.getElementById('m-decls').textContent=d.declarations.length?d.declarations.join(', '):'None on file';
  document.getElementById('m-counties').textContent=cText(d);
  document.getElementById('modal').style.display='flex';
}
function closeModal(ev){if(ev.target===document.getElementById('modal'))document.getElementById('modal').style.display='none';}
document.getElementById('search').addEventListener('input',function(){st.search=this.value;render();});
document.getElementById('clear-btn').addEventListener('click',function(){st={activeTab:'FL',statusTab:'all',search:'',expanded:{}};document.getElementById('search').value='';render();});
applyLiveStatus();
render();
</script>
